# ------------------------------
# HTTP (port 80) — Redirect + Certbot
# ------------------------------
server {
    listen 80;
    server_name api.mfolks.com admin.mfolks.com b.mfolks.com bserver.mfolks.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------
# UPSTREAMS (MUST be in http block)
# ------------------------------
# upstream geotrix_nodes {
#     least_conn;
#     server geotrix:3000;
# }

upstream admin_nodes {
    least_conn;
    server admin:3001;
}

upstream server_nodes {
    least_conn;
    server server:5000;
}

upstream bom_frontend_nodes {
    least_conn;
    server bom_frontend:3000;
}

upstream bom_server_nodes {
    least_conn;
    server bom_server:5000;
}

