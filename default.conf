# ------------------------------
# ADMIN HTTPS
# ------------------------------
server {
    listen 443 ssl;
    server_name admin.mfolks.com;

    ssl_certificate     /etc/letsencrypt/live/admin.mfolks.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.mfolks.com/privkey.pem;

    location / {
        proxy_pass http://admin_nodes;
        proxy_http_version 1.1;

        # Forward headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WS-safe (does not hurt even if frontend doesn't use WS)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;

        proxy_buffering off;
    }
}

# ------------------------------
# SERVER HTTPS (WEBSOCKET SAFE)
# ------------------------------
server {
    listen 443 ssl;
    server_name api.mfolks.com;

    ssl_certificate     /etc/letsencrypt/live/api.mfolks.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mfolks.com/privkey.pem;

    location / {
        proxy_pass http://server_nodes;
        proxy_http_version 1.1;

        # 🔥 REQUIRED FOR WEBSOCKETS
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 🔥 REQUIRED FOR LONG-LIVED SOCKETS
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;

        # 🔥 REQUIRED
        proxy_buffering off;
    }
}

